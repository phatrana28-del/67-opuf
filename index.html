<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PC ZONE | Social Media</title>

<meta name="theme-color" content="#080808">
<meta name="description" content="PC ZONE Social Media - Follow me on social media">

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');

:root {
    --bg: #080808;
    --card: #121212;
    --text: #ffffff;
    --muted: #999999;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Kanit', sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at 50% 0%, #321015 0%, transparent 45%),
        #080808;
    padding: 30px 18px;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
}

/* HEADER */

.header {
    text-align: center;
    padding: 35px 10px 30px;
    animation: fadeIn .7s ease;
}

.logo {
    width: 100px;
    height: 100px;
    margin: 0 auto 18px;
    border-radius: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff3030, #7b1010);
    box-shadow: 0 0 35px #ff202033;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 2px;
}

.header h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 2px;
}

.header h1 span {
    color: #ff4242;
}

.bio {
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
    font-weight: 300;
}

.badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 15px;
    border: 1px solid #ffffff18;
    background: #ffffff08;
    border-radius: 30px;
    color: #dddddd;
    font-size: 12px;
}

/* SECTION TITLE */

.section-title {
    font-size: 13px;
    color: #888;
    letter-spacing: 2px;
    margin: 15px 4px 14px;
}

/* SOCIAL CARDS */

.social-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.social-card {
    --accent: #ffffff;

    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 18px;
    min-height: 94px;

    text-decoration: none;
    color: white;

    background:
        linear-gradient(110deg, #ffffff08, transparent 70%),
        var(--card);

    border: 1px solid #ffffff12;
    border-radius: 20px;
    overflow: hidden;

    transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        background .22s ease;

    animation: slideUp .5s ease both;
}

.social-card:nth-child(2) {
    animation-delay: .08s;
}

.social-card:nth-child(3) {
    animation-delay: .16s;
}

.social-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        110deg,
        var(--accent),
        transparent 75%
    );
    opacity: 0;
    transition: opacity .22s ease;
    pointer-events: none;
}

.social-card:hover,
.social-card:focus-visible {
    transform: scale(1.025);
    border-color: var(--accent);
    box-shadow: 0 0 25px color-mix(in srgb, var(--accent) 22%, transparent);
    outline: none;
}

.social-card:hover::before,
.social-card:focus-visible::before {
    opacity: .08;
}

.social-card:active {
    transform: scale(.975);
}

.icon {
    width: 54px;
    height: 54px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 17px;
    background: color-mix(in srgb, var(--accent) 15%, #111);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
}

.icon svg {
    width: 29px;
    height: 29px;
    fill: currentColor;
    color: var(--accent);
}

.social-info {
    flex: 1;
    min-width: 0;
}

.social-name {
    font-size: 17px;
    font-weight: 500;
}

.username {
    display: block;
    color: #999;
    font-size: 12px;
    margin-top: 2px;
    overflow-wrap: anywhere;
}

.arrow {
    font-size: 25px;
    color: var(--accent);
    transition: transform .22s ease;
}

.social-card:hover .arrow {
    transform: translateX(5px);
}

/* PLATFORM COLORS */

.instagram {
    --accent: #ff65a3;
}

.tiktok {
    --accent: #42f5e9;
}

.youtube {
    --accent: #ff3030;
}

/* FOOTER */

.footer {
    margin-top: 38px;
    padding: 22px 10px;
    text-align: center;
    border-top: 1px solid #ffffff10;
}

.footer p {
    color: #777;
    font-size: 12px;
}

.footer strong {
    color: #ff4242;
    font-weight: 500;
}

.footer .made {
    margin-top: 7px;
    color: #555;
    font-size: 11px;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}

@media (max-width: 380px) {
    .header h1 {
        font-size: 29px;
    }

    .social-card {
        padding: 14px;
        gap: 12px;
    }

    .icon {
        width: 48px;
        height: 48px;
    }
}
</style>
</head>
